[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tushare-stock-collector"
version = "0.1.0"
description = "Standalone Tushare stock Raw collector and local task console"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.30,<1",
    "tushare==1.4.29",
    "six>=1.16,<2",
    "pyarrow>=18",
    "duckdb>=1.5,<2",
]

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[project.scripts]
tushare-collector = "collector.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
collector = ["catalog.json", "permissions.json", "static/*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
