name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      TUSHARE_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check src scripts tests
      - run: uv run --locked python -m unittest discover -s tests -q
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
